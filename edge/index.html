<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>viki</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16171a">
<!-- iOS ignores most of the manifest. These three are what actually make an
     installed iOS PWA look installed, and they are not optional there. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="viki">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root{--bg:#fbfaf7;--fg:#1a1a19;--dim:#6b6b66;--line:#e3e0d8;--accent:#7a5c3e;--warn:#8a6d1f}
  @media (prefers-color-scheme:dark){
    :root{--bg:#16171a;--fg:#e8e6e1;--dim:#9a978f;--line:#2c2e33;--accent:#c9a227;--warn:#c9a227}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  body{padding:max(.75rem,env(safe-area-inset-top)) max(.75rem,env(safe-area-inset-right))
       max(.75rem,env(safe-area-inset-bottom)) max(.75rem,env(safe-area-inset-left));
       max-width:46rem;margin-inline:auto}
  header{display:flex;align-items:baseline;gap:.5rem;margin-bottom:.5rem}
  h1{font-size:1rem;font-weight:600;letter-spacing:.02em;margin:0}
  .status{color:var(--dim);font-size:.78rem}
  /* ONE INPUT, TWO VERBS: the same text is either a question or a thought. */
  .box{display:flex;gap:.5rem;align-items:stretch}
  textarea{flex:1;padding:.65rem .75rem;font:inherit;border:1px solid var(--line);
    border-radius:.55rem;background:var(--bg);color:var(--fg);resize:none;min-height:2.9rem;max-height:9rem}
  button{padding:.55rem .8rem;font-size:.85rem;border:1px solid var(--line);
    border-radius:.5rem;background:transparent;color:var(--fg);white-space:nowrap}
  button.primary{border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.4}
  .chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.6rem 0 .2rem}
  .chip{font-size:.72rem;padding:.2rem .5rem;border:1px solid var(--line);border-radius:1rem;color:var(--dim)}
  .chip.on{border-color:var(--accent);color:var(--accent)}
  .hit{border-top:1px solid var(--line);padding:.75rem 0}
  .meta{font:11.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);
    word-break:break-all;margin-bottom:.3rem}
  .rrf{color:var(--accent)}
  .tribe{color:var(--fg);opacity:.75}
  .snip{white-space:pre-wrap;font-size:.9rem}
  .mark{color:var(--dim);font-style:italic;font-size:.78rem}
  .local{border-left:2px solid var(--warn);padding-left:.6rem}
  .localtag{color:var(--warn);font-size:.72rem}
  .note{color:var(--dim);font-size:.82rem;padding:.6rem 0}
  .install{border:1px solid var(--accent);border-radius:.55rem;padding:.7rem .8rem;
    margin:.6rem 0;font-size:.85rem;display:none}
  .install b{color:var(--accent)}
</style>

<header>
  <h1>viki</h1><span class="status" id="status">starting…</span>
</header>

<div class="install" id="install"></div>

<div class="box">
  <textarea id="q" rows="1" placeholder="ask, or write something down…" enterkeyhint="search"></textarea>
  <button id="keep" class="primary" title="save this text as a capture">keep</button>
</div>
<div class="chips" id="chips"></div>
<div id="out"></div>

<script src="ort.min.js"></script>
<script src="viki-edge.js"></script>
<script>
/* ------------------------------------------------------------------ *
 * viki edge, as an installable app.
 *
 * THE EDGE IS READ-ONLY. It answers from caches other peers built; it
 * cannot write to them. So `keep` does NOT index anything -- it appends
 * to a local, append-only queue and that queue is searched alongside the
 * tribes, with its hits visibly marked as not-yet-indexed. Hiding that
 * distinction would recreate QUEUE 36's exact complaint from the other
 * side: text you wrote and then cannot find.
 * ------------------------------------------------------------------ */
const MARK_HEAD="<<document continues above>>",
      MARK_TAIL="<<document continues below>>",
      MARK_CUT ="<<excerpt truncated>>";
const $ = id => document.getElementById(id);
const setStatus = t => $('status').textContent = t;

let M=null, ready=false, session=null, MODEL_ID='', tribes=[];

/* ---- local capture queue (IndexedDB; append-only, per M-2) ---------- */
const DB='viki-edge', STORE='captures';
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});
  r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error);});}
async function capAdd(text){const d=await idb();return new Promise((ok,no)=>{
  const t=d.transaction(STORE,'readwrite');
  t.objectStore(STORE).add({text,ts:new Date().toISOString(),synced:0});
  t.oncomplete=ok; t.onerror=()=>no(t.error);});}
async function capAll(){const d=await idb();return new Promise((ok,no)=>{
  const r=d.transaction(STORE).objectStore(STORE).getAll();
  r.onsuccess=()=>ok(r.result||[]); r.onerror=()=>no(r.error);});}

/* ---- iOS: install is not a nicety, it is what makes offline durable -- */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
           || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const standalone = window.matchMedia('(display-mode: standalone)').matches
                || window.navigator.standalone === true;
function installAdvice(){
  const el=$('install');
  if (standalone) return;
  if (isIOS){
    // Safari offers no install prompt, and only a home-screen PWA is exempt
    // from the 7-day eviction of script-writable storage. Say why, not just what.
    el.innerHTML = 'On iOS, tap <b>Share</b> then <b>Add to Home Screen</b>. '
      + 'That is not cosmetic: only an installed app keeps its offline data past '
      + 'a week of not being opened.';
    el.style.display='block';
  }
}

/* ---- pulled cache, kept in OPFS so it survives a shell cache bump ---- */
const OPFS_NAME='viki-cache.db';
async function opfsRead(n){try{
  const d=await navigator.storage.getDirectory();
  const f=await (await d.getFileHandle(n)).getFile();
  return f.size?new Uint8Array(await f.arrayBuffer()):null;}catch(_){return null;}}
async function opfsWrite(n,b){try{
  const d=await navigator.storage.getDirectory();
  const h=await d.getFileHandle(n,{create:true});
  const w=await h.createWritable(); await w.write(b); await w.close(); return true;
}catch(_){return false;}}

async function openTribe(label,bytes){
  const path='/'+label+'.db';
  M.FS.writeFile(path,bytes);
  const slot=M.ccall('edge_tribe_add','number',['string','string','string'],[label,path,'']);
  if(slot<0) return false;
  tribes.push({label,slot,chunks:M.ccall('edge_tribe_chunks','number',['number'],[slot])});
  return true;
}
function drawChips(){
  const c=$('chips'); c.textContent='';
  for(const t of tribes){const s=document.createElement('span');
    s.className='chip on'; s.textContent=`${t.label} · ${t.chunks}`; c.appendChild(s);}
  const s=document.createElement('span'); s.className='chip';
  s.textContent = session ? 'hybrid' : 'bm25+literal'; c.appendChild(s);
}

async function loadModel(){try{
  MODEL_ID=(await (await fetch('viki-manifest.json',{cache:'force-cache'})).json()).model_id;
  M.FS.writeFile('/vocab.txt',new Uint8Array(await (await fetch('vocab.txt',{cache:'force-cache'})).arrayBuffer()));
  if(!M.ccall('edge_vocab_load','number',['string'],['/vocab.txt'])) return false;
  session=await ort.InferenceSession.create('model.onnx'); return true;
}catch(_){return false;}}

async function embedQuery(text){
  if(!session) return false;
  const P=M._malloc(256*4);
  const n=M.ccall('edge_tokenize','number',['string','number','number'],[text,P,256]);
  const ids=Array.from(new Int32Array(M.HEAP32.buffer,P,n)); M._free(P);
  if(!n) return false;
  const big=BigInt64Array.from(ids.map(BigInt));
  const out=await session.run({
    input_ids:new ort.Tensor('int64',big,[1,n]),
    attention_mask:new ort.Tensor('int64',BigInt64Array.from(ids.map(()=>1n)),[1,n]),
    token_type_ids:new ort.Tensor('int64',BigInt64Array.from(ids.map(()=>0n)),[1,n])});
  const h=out[session.outputNames[0]]; const [,L,D]=h.dims;
  const hp=M._malloc(h.data.length*4); M.HEAPF32.set(h.data,hp>>2);
  const ok=M.ccall('edge_set_query_from_hidden','number',
                   ['number','number','number','string'],[hp,L,D,MODEL_ID]); M._free(hp);
  return !!ok;
}

function markEl(t){const d=document.createElement('div');d.className='mark';d.textContent=t;return d;}

async function search(){
  const q=$('q').value.trim(), out=$('out'); out.textContent='';
  if(!q) return;
  const locals=(await capAll()).filter(c=>c.text.toLowerCase().includes(q.toLowerCase()));
  let hits=[];
  if(ready){
    if(session){ if(!await embedQuery(q)) M.ccall('edge_clear_query_vector',null,[],[]); }
    const p=M.ccall('edge_ask_all','number',['string','number'],[q,8]);
    try{hits=(JSON.parse(M.UTF8ToString(p)).results)||[];}catch(_){}
    M.ccall('edge_free',null,['number'],[p]);
  }
  if(!hits.length && !locals.length){
    const d=document.createElement('div'); d.className='note';
    d.textContent = ready ? '(no matches)' : '(no tribe loaded yet)';
    out.appendChild(d); return;
  }
  // Local captures first and visibly marked: they are the newest thing you
  // know and the one thing no tribe has seen yet.
  for(const c of locals){
    const d=document.createElement('div'); d.className='hit local';
    const m=document.createElement('div'); m.className='meta';
    const tag=document.createElement('span'); tag.className='localtag';
    tag.textContent='captured here · not yet indexed · '; m.appendChild(tag);
    m.appendChild(document.createTextNode(c.ts));
    const s=document.createElement('div'); s.className='snip'; s.textContent=c.text;
    d.appendChild(m); d.appendChild(s); out.appendChild(d);
  }
  for(const h of hits){
    const d=document.createElement('div'); d.className='hit';
    const m=document.createElement('div'); m.className='meta';
    const r=document.createElement('span'); r.className='rrf';
    r.textContent=`[${h.rank}] rrf=${h.rrf.toFixed(4)} `; m.appendChild(r);
    if(h.tribe){const t=document.createElement('span'); t.className='tribe';
      t.textContent=h.tribe+' '; m.appendChild(t);}
    m.appendChild(document.createTextNode(
      `${h.hash.slice(0,12)}…#${h.chunk_ix}${h.chunk_count?' of '+h.chunk_count:''}  ${h.source}`));
    d.appendChild(m);
    if(h.fragment_head) d.appendChild(markEl(MARK_HEAD));
    const s=document.createElement('div'); s.className='snip'; s.textContent=h.snippet;
    d.appendChild(s);
    if(h.snippet_truncated) d.appendChild(markEl(MARK_CUT));
    if(h.fragment_tail) d.appendChild(markEl(MARK_TAIL));
    out.appendChild(d);
  }
}

let timer=null;
function wireInput(){
  $('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{
    search().catch(e=>fatal('search', e));
  },180);});
  $('keep').onclick=async()=>{
    const t=$('q').value.trim(); if(!t) return;
    try{
      await capAdd(t); $('q').value='';
      setStatus('kept · '+(await capAll()).length+' local capture(s)');
      $('out').textContent='';
    }catch(e){ fatal('keep', e); }
  };
}

/* ---- boot ----------------------------------------------------------
 *
 * EVERY STEP REPORTS ITS OWN FAILURE. The first build of this page wrapped
 * boot in a bare async IIFE, so when `edge_tribe_add` was missing from the
 * plain wasm build the promise rejected and the status line said "loading..."
 * forever, with the reason only in a console nobody opens on a phone. That is
 * QUEUE 36's "every failure looks the same" reappearing in the UI, and it is
 * the worst failure mode available: indistinguishable from slow.
 *
 * So: nothing here may throw past its own step, and the status line always
 * says which step failed. A degraded app that explains itself beats a
 * beautiful one that hangs.
 */
function fatal(where, err){
  setStatus(where + ' failed');
  const d=document.createElement('div'); d.className='note';
  d.textContent = where + ' failed: ' + (err && err.message ? err.message : String(err));
  $('out').appendChild(d);
  console.error(where, err);
}
(async ()=>{
  installAdvice();
  if('serviceWorker' in navigator){ try{ await navigator.serviceWorker.register('sw.js'); }catch(_){} }
  // Ask for storage that survives pressure. On iOS an installed PWA is what
  // actually grants this; the call is still correct to make everywhere.
  try{ if(navigator.storage?.persist) await navigator.storage.persist(); }catch(_){}

  try { M = await VikiEdge(); }
  catch(e){ return fatal('wasm load', e); }
  setStatus('loading…');

  // Capture works with no tribe at all, so wire the buttons BEFORE anything
  // that can fail. On a phone with a bad connection, being able to write
  // something down is the part that must not depend on the rest.
  wireInput();

  let bytes = null;
  try { bytes = await opfsRead(OPFS_NAME); } catch(e){ console.warn('opfs read', e); }
  if(!bytes){
    try{
      setStatus('pulling cache…');
      const r=await fetch('cache.db',{cache:'no-store'});
      if(r.ok){ bytes=new Uint8Array(await r.arrayBuffer()); await opfsWrite(OPFS_NAME,bytes); }
      else setStatus('hub answered HTTP '+r.status);
    }catch(e){ setStatus('offline, and no local cache yet'); }
  }
  if(bytes){
    try { if(await openTribe('local',bytes)) ready=true;
          else setStatus('that cache did not open (wrong key, or not a viki cache)'); }
    catch(e){ return fatal('opening the cache', e); }
  }

  drawChips();
  if(ready) setStatus(`${tribes.reduce((a,t)=>a+t.chunks,0)} chunks · offline`);
  else if(!/failed|HTTP|offline|did not open/.test($('status').textContent))
    setStatus('no tribe loaded — you can still capture');

  if(ready){
    // The model is 23MB. It is optional by design: BM25 + the literal leg
    // answer without it, and saying so beats a spinner.
    setStatus($('status').textContent + ' · loading model…');
    let ok=false;
    try { ok = await loadModel(); } catch(e){ console.warn('model', e); }
    drawChips();
    setStatus($('status').textContent.replace(' · loading model…', ok ? ' · hybrid' : ' · keyword only'));
  }

  // SHARE-IN. Android gets a real share_target; iOS has none, so the same
  // ?capture= parameter is what an iOS Shortcut posts to. One code path,
  // two very different front doors.
  const p=new URLSearchParams(location.search);
  const shared=[p.get('capture'),p.get('title'),p.get('url')].filter(Boolean).join('\n');
  if(shared){ $('q').value=shared; history.replaceState({},'',location.pathname); $('q').focus(); }
})();
</script>
